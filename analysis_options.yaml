# Configuración del analizador de Dart/Flutter.
# Lints disponibles: https://dart.dev/lints
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - landing/**
    - landing-page/**
    - functions/**
    - docs/**

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    unawaited_futures: true
    prefer_const_constructors: true
