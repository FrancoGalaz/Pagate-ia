name: pagate_ia
description: "Págate-IA — Asistente financiero para artesanos y creadores."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0-113.1.beta

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  equatable: ^2.0.7
  intl: ^0.20.2
  cloud_firestore: ^5.6.0
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.0
  http: ^1.3.0
  fl_chart: ^0.70.2
  pdf: ^3.11.3
  printing: ^5.14.2
  cloud_functions: ^5.6.2
  firebase_app_check: ^0.3.2+10

  # Abrir los textos legales en el navegador del sistema. Sin esto, la linea
  # legal de Bienvenida solo copiaba la URL al portapapeles: el usuario
  # aceptaba unos terminos que no podia leer, que es material de rechazo en
  # la revision de Google Play.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true

  # LOS DOS TTF DEL INFORME EN PDF, declarados como ASSETS y NO como una
  # familia de fuentes.
  #
  # Van aqui, y no en `fonts:`, a proposito: registrarlos como caras de la
  # familia Manrope cambiaria la tipografia de TODA la app (el motor elegiria
  # entre tres caras en vez de mover el eje `wght` de la variable, que es lo
  # que hace `core/theme/app_text.dart`). Como assets solo se empaquetan para
  # que `rootBundle.load` los lea desde `core/services/pdf_report_service.dart`.
  #
  # Son instancias estaticas de `Manrope[wght].ttf`, generadas con
  # `fontTools.varLib.instancer` en los pesos 400 y 700. Hacen falta porque el
  # paquete `pdf` no interpreta `fvar`/`gvar`: embeber la variable tal cual
  # pondria el informe entero en ExtraLight (el default del eje es 200) y sin
  # diferencia entre un total y una linea de detalle. Conservan el copyright y
  # el aviso de licencia OFL en su tabla `name`.
  assets:
    - assets/fonts/pdf/Manrope-Regular.ttf
    - assets/fonts/pdf/Manrope-Bold.ttf

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope[wght].ttf
