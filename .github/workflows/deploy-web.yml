name: Deploy (hosting + firestore + functions)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  FIREBASE_PROJECT: pagate-17211

jobs:
  deploy:
    name: Build web y desplegar a Firebase
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Build Flutter web
        run: |
          flutter pub get
          flutter build web --release \
            --dart-define=PAGATE_ENV=prod \
            --dart-define=APP_CHECK_SITE_KEY=${{ secrets.APP_CHECK_SITE_KEY }}

      - name: Build Cloud Functions
        working-directory: functions
        run: |
          npm ci
          npm run build

      # Hosting: usa la cuenta de servicio (JSON) creada por
      # `firebase init hosting:github` o manualmente en Google Cloud IAM.
      - name: Deploy hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ env.FIREBASE_PROJECT }}

      # Reglas de Firestore + Cloud Functions con la misma cuenta de servicio.
      - name: Deploy firestore rules + functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npm --prefix functions exec -- firebase deploy \
            --only firestore,functions \
            --project "$FIREBASE_PROJECT" \
            --non-interactive --force
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
