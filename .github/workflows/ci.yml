name: CI

on:
  push:
    branches: [main, master, arquitectura-segura]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter (analyze, test, build web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Misma versión que el PC del dueño (`flutter --version`). Sin fijarla,
      # la beta nueva rompe `flutter analyze` sin que cambie el código.
      - uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.42.0-0.0.pre
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # La web está fuera de alcance: se sigue construyendo para ver si se
      # rompe, pero no hace fallar el CI.
      - run: flutter build web --release
        continue-on-error: true

  functions:
    name: Cloud Functions (build, test con emulador)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El emulador de Firestore necesita Java.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache emuladores de Firebase
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('functions/package-lock.json') }}
          restore-keys: |
            firebase-emulators-${{ runner.os }}-

      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run build
      - run: npm test

  landing:
    name: Landing (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: landing/package-lock.json

      # El lock lo genera npm 11.6.2 (el del PC del dueño). El npm 10 que trae
      # Node 22 lo rechaza en `npm ci` («Missing: @emnapi/core»).
      - run: npm install -g npm@11.6.2
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_WAITLIST_URL: https://southamerica-west1-pagate-17211.cloudfunctions.net/waitlist
